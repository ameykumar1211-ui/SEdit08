<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080A" />
    <title>SEdit08 — Admin Control Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #08080a;
        color: #f2efe9;
        font-family: "Space Grotesk", system-ui, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        text-align: center;
        padding: 32px;
        background: radial-gradient(circle at 50% 40%, rgba(233, 161, 59, 0.14), transparent 62%);
      }
      .mark {
        width: 46px;
        height: 46px;
        color: #e9a13b;
      }
      h1 {
        font-family: "Instrument Serif", serif;
        font-weight: 400;
        font-size: clamp(2.4rem, 8vw, 4rem);
        line-height: 0.95;
        margin: 0;
      }
      h1 em {
        color: #e9a13b;
      }
      .label {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.66rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #8c8880;
        margin: 0;
      }
      .bar {
        width: 220px;
        height: 2px;
        background: rgba(242, 239, 233, 0.14);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 40%;
        background: #e9a13b;
        animation: slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(320%);
        }
      }
      a.go {
        display: inline-block;
        border: 1px solid #e9a13b;
        color: #e9a13b;
        text-decoration: none;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.66rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        padding: 15px 26px;
      }
      a.go:hover {
        background: #e9a13b;
        color: #08080a;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="1.6" y="1.6" width="36.8" height="36.8" rx="8.5" stroke="currentColor" stroke-width="2.2" />
        <rect x="5.6" y="7.4" width="5.2" height="3.6" rx="1.1" fill="currentColor" />
        <rect x="5.6" y="29" width="5.2" height="3.6" rx="1.1" fill="currentColor" />
        <rect x="29.2" y="7.4" width="5.2" height="3.6" rx="1.1" fill="currentColor" />
        <rect x="29.2" y="29" width="5.2" height="3.6" rx="1.1" fill="currentColor" />
        <path
          d="M27.4 13.9c-1.7-2.1-4.4-3.2-7.3-3.2-3.8 0-6.4 2-6.4 4.9 0 6.9 14.2 3.5 14.2 10.8 0 3.1-2.9 5.3-7.2 5.3-3.4 0-6.3-1.3-8.1-3.6"
          stroke="currentColor"
          stroke-width="2.6"
          stroke-linecap="round"
        />
      </svg>
      <p class="label">SEdit08 · control room</p>
      <h1>Opening the <em>admin</em> desk…</h1>
      <div class="bar"><i></i></div>
      <a class="go" href="./index.html#/admin">Continue to admin →</a>
      <p class="label">Inquiries · portfolio · YouTube Shorts</p>
    </div>

    <script>
      // The admin panel ships inside the main bundle: admin.html simply hands over.
      setTimeout(function () {
        window.location.replace("./index.html#/admin");
      }, 700);
    </script>
  </body>
</html>
