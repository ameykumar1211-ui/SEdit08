<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God Level Admin | SEdit08</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'sans-serif'],
                        'display': ['Cinzel', 'serif'],
                    },
                    colors: {
                        gold: { 400: '#EAB308', 500: '#D4AF37', 600: '#B8860B' },
                        dark: '#050505',
                        panel: '#0f0f11'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #f3f4f6; }
        .glass-panel {
            background: rgba(20, 20, 22, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col relative selection:bg-gold-500 selection:text-black">

    <!-- Login Overlay -->
    <div id="loginScreen" class="fixed inset-0 z-[100] flex flex-col justify-center items-center bg-[#050505] transition-opacity duration-500">
        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-10 mix-blend-screen pointer-events-none"></div>
        <div class="glass-panel p-10 rounded-3xl max-w-sm w-full mx-4 text-center relative z-10">
            <h1 class="text-3xl font-display text-gold-500 mb-2">SEdit08</h1>
            <p class="text-xs uppercase tracking-widest text-gray-500 mb-8">Secured Access</p>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="text-xs text-gray-400 tracking-wider uppercase mb-1 block">Passphrase</label>
                    <input type="password" id="adminPwd" class="w-full bg-black/50 border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-gold-500 transition-colors text-center tracking-widest" placeholder="••••••••">
                </div>
                <button onclick="checkLogin()" class="w-full py-3 bg-gradient-to-r from-gold-600 to-gold-400 hover:from-gold-500 hover:to-gold-300 text-black font-bold text-sm uppercase tracking-widest rounded-lg transition-all shadow-[0_0_15px_rgba(212,175,55,0.2)] hover:shadow-[0_0_25px_rgba(212,175,55,0.5)]">
                    Authenticate
                </button>
            </div>
            <p id="loginError" class="text-red-500 text-sm mt-4 hidden">Access Denied.</p>
        </div>
    </div>

    <!-- Modal for notifications -->
    <div id="notificationModal" class="fixed inset-0 z-[110] flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
        <div class="glass-panel p-6 rounded-2xl z-10 max-w-sm w-full mx-4 text-center transform scale-95 transition-transform duration-300 border-gold-500/30" id="modalContent">
            <h3 class="text-lg font-display text-gold-500 mb-2" id="modalTitle">Notice</h3>
            <p class="text-gray-400 mb-6 text-sm font-light" id="modalMessage">...</p>
            <button onclick="closeModal()" class="px-6 py-2 border border-gold-500 text-gold-500 hover:bg-gold-500 hover:text-black font-semibold rounded-lg transition-colors w-full uppercase tracking-wider text-xs">Acknowledge</button>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-[#030303] border-b border-gold-500/10 py-4 px-6 sticky top-0 z-30">
        <div class="max-w-screen-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <span class="text-gold-500 font-display font-bold text-2xl tracking-widest">SEdit08</span>
                <span class="text-gold-500/50 text-[10px] uppercase tracking-[0.2em] border border-gold-500/20 px-3 py-1 rounded-full hidden sm:inline-block">Command Center</span>
            </div>
            <a href="index.html" class="text-xs uppercase tracking-widest text-gray-500 hover:text-gold-500 transition-colors flex items-center gap-2">
                Live Site <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-screen-2xl mx-auto w-full px-4 sm:px-6 py-8 grid grid-cols-1 xl:grid-cols-12 gap-8">
        
        <!-- Left Column: Inquiries -->
        <section class="xl:col-span-8 space-y-6">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-display text-white tracking-wide">Client Inquiries</h2>
                <div class="text-xs text-gold-500 uppercase tracking-widest bg-gold-500/10 px-3 py-1 rounded-full" id="inquiryCount">Loading...</div>
            </div>
            
            <div class="glass-panel rounded-2xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-[#020202] text-gray-500 text-xs uppercase tracking-wider border-b border-gold-500/10">
                            <tr>
                                <th class="px-6 py-4 font-medium">Timestamp</th>
                                <th class="px-6 py-4 font-medium">Client</th>
                                <th class="px-6 py-4 font-medium">Contact</th>
                                <th class="px-6 py-4 font-medium">Vision</th>
                                <th class="px-6 py-4 font-medium text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="inquiriesTable" class="divide-y divide-gray-800/30">
                            <tr>
                                <td colspan="5" class="px-6 py-8 text-center text-gray-500 font-light">Establishing secure link...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Right Column: Managers -->
        <section class="xl:col-span-4 space-y-8">
            
            <!-- Portfolio Manager -->
            <div>
                <h2 class="text-xl font-display text-white tracking-wide mb-6">Masterpieces</h2>
                <div class="glass-panel p-6 rounded-2xl space-y-6">
                    <form id="addPortfolioForm" class="space-y-4">
                        <div>
                            <input type="url" id="ytLink" required placeholder="YouTube Link (Shorts/Watch)" class="w-full bg-black/60 border border-gray-800 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-gold-500 transition-colors font-light">
                        </div>
                        <button type="submit" class="w-full py-3 border border-gold-500 text-gold-500 hover:bg-gold-500 hover:text-black font-semibold uppercase tracking-widest text-xs rounded-lg transition-colors">
                            Add to Gallery
                        </button>
                    </form>
                    
                    <div class="border-t border-gray-800/50 pt-4">
                        <h3 class="text-[10px] text-gray-500 mb-3 uppercase tracking-widest">Active Gallery</h3>
                        <ul id="portfolioList" class="space-y-2 max-h-[250px] overflow-y-auto pr-1">
                            <li class="text-xs text-gray-500 text-center py-2">Loading...</li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Feedback Manager -->
            <div>
                <h2 class="text-xl font-display text-white tracking-wide mb-6">Client Legacies</h2>
                <div class="glass-panel p-6 rounded-2xl space-y-6">
                    <form id="addFeedbackForm" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="fbName" required placeholder="Client Name" class="w-full bg-black/60 border border-gray-800 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-gold-500 transition-colors font-light">
                            <input type="text" id="fbRole" placeholder="Role/Company" class="w-full bg-black/60 border border-gray-800 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-gold-500 transition-colors font-light">
                        </div>
                        <div>
                            <select id="fbRating" class="w-full bg-black/60 border border-gray-800 rounded-lg px-4 py-3 text-sm text-gray-400 focus:outline-none focus:border-gold-500 transition-colors font-light appearance-none">
                                <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                                <option value="4">⭐⭐⭐⭐ (4/5)</option>
                                <option value="3">⭐⭐⭐ (3/5)</option>
                            </select>
                        </div>
                        <div>
                            <textarea id="fbComment" required rows="3" placeholder="Client Testimonial..." class="w-full bg-black/60 border border-gray-800 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-gold-500 transition-colors resize-none font-light"></textarea>
                        </div>
                        <button type="submit" class="w-full py-3 bg-gold-500 hover:bg-gold-400 text-black font-semibold uppercase tracking-widest text-xs rounded-lg transition-colors">
                            Publish Legacy
                        </button>
                    </form>
                    
                    <div class="border-t border-gray-800/50 pt-4">
                        <h3 class="text-[10px] text-gray-500 mb-3 uppercase tracking-widest">Published Legacies</h3>
                        <ul id="feedbacksList" class="space-y-3 max-h-[300px] overflow-y-auto pr-1">
                            <li class="text-xs text-gray-500 text-center py-2">Loading...</li>
                        </ul>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sedit08-luxury-app';
        
        const firebaseConfig = {
            apiKey: "AIzaSyA4xff2ih3WIwu--vVwgiY9uFpWS7RbN34",
            authDomain: "network-high.firebaseapp.com",
            projectId: "network-high",
            storageBucket: "network-high.firebasestorage.app",
            messagingSenderId: "373475652710",
            appId: "1:373475652710:web:221457575c1e6847d569a7",
            measurementId: "G-G7T0CVV01J"
        };

        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase init failed:", e);
        }

        // Login Logic (Client Side check as per request)
        window.checkLogin = () => {
            const pwd = document.getElementById('adminPwd').value;
            const err = document.getElementById('loginError');
            if (pwd === "Iamadmin") {
                document.getElementById('loginScreen').classList.add('opacity-0');
                setTimeout(() => {
                    document.getElementById('loginScreen').classList.add('hidden');
                    initAdmin(); // Only init data fetching after successful login
                }, 500);
            } else {
                err.classList.remove('hidden');
                setTimeout(()=> err.classList.add('hidden'), 3000);
            }
        };

        // Modal Logic
        const modal = document.getElementById('notificationModal');
        const modalContent = document.getElementById('modalContent');
        window.showModal = (title, message) => {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        };
        window.closeModal = () => {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        };

        const formatDate = (timestamp) => {
            if (!timestamp) return '-';
            const d = new Date(timestamp);
            return d.toLocaleDateString() + ' <span class="text-gray-600 ml-1">' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + '</span>';
        };

        // Data Loaders
        function loadInquiries() {
            const tableBody = document.getElementById('inquiriesTable');
            const countEl = document.getElementById('inquiryCount');
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'inquiries');
            
            onSnapshot(colRef, (snapshot) => {
                if (snapshot.empty) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-gray-600 font-light">No inquiries present.</td></tr>`;
                    countEl.textContent = "0";
                    return;
                }

                const items = [];
                snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                items.sort((a, b) => b.timestamp - a.timestamp);

                countEl.textContent = `${items.length}`;
                tableBody.innerHTML = '';

                items.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-white/[0.02] transition-colors group border-b border-gray-800/30 last:border-0';
                    const descSafe = (item.description || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    
                    tr.innerHTML = `
                        <td class="px-6 py-4 text-gray-400 text-xs">${formatDate(item.timestamp)}</td>
                        <td class="px-6 py-4 font-medium text-white">${item.name || 'N/A'}</td>
                        <td class="px-6 py-4 text-gold-500 font-mono text-xs">${item.whatsapp || 'N/A'}</td>
                        <td class="px-6 py-4 text-gray-400 max-w-[200px] truncate font-light" title="${descSafe}">${descSafe}</td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="deleteDocHandler('inquiries', '${item.id}')" class="text-red-500/50 hover:text-red-500 transition-colors text-[10px] font-semibold uppercase tracking-wider border border-red-500/20 px-3 py-1 rounded">Purge</button>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            }, (error) => console.error(error));
        }

        function loadPortfolio() {
            const list = document.getElementById('portfolioList');
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'portfolio');
            
            onSnapshot(colRef, (snapshot) => {
                if (snapshot.empty) {
                    list.innerHTML = `<li class="text-xs text-gray-600 text-center py-2">Empty Gallery.</li>`;
                    return;
                }
                const items = [];
                snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                items.sort((a, b) => b.timestamp - a.timestamp);

                list.innerHTML = '';
                items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'bg-black/40 border border-gray-800/50 p-3 rounded-lg flex justify-between items-center gap-3 hover:border-gold-500/30 transition-colors';
                    const displayUrl = item.url.replace(/^https?:\/\/(www\.)?/, '').substring(0, 25) + "...";

                    li.innerHTML = `
                        <div class="truncate text-xs text-gray-400 font-light" title="${item.url}">
                            <a href="${item.url}" target="_blank" class="hover:text-gold-500 transition-colors">${displayUrl}</a>
                        </div>
                        <button onclick="deleteDocHandler('portfolio', '${item.id}')" class="text-red-500/70 hover:text-red-500 p-1 transition-colors">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    `;
                    list.appendChild(li);
                });
            }, (error) => console.error(error));
        }

        function loadFeedbacks() {
            const list = document.getElementById('feedbacksList');
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'feedbacks');
            
            onSnapshot(colRef, (snapshot) => {
                if (snapshot.empty) {
                    list.innerHTML = `<li class="text-xs text-gray-600 text-center py-2">No legacies published.</li>`;
                    return;
                }
                const items = [];
                snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                items.sort((a, b) => b.timestamp - a.timestamp);

                list.innerHTML = '';
                items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'bg-black/40 border border-gray-800/50 p-3 rounded-lg relative hover:border-gold-500/30 transition-colors';
                    const safeName = (item.name || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    
                    li.innerHTML = `
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-xs font-semibold text-white">${safeName}</span>
                            <button onclick="deleteDocHandler('feedbacks', '${item.id}')" class="text-red-500/70 hover:text-red-500 p-0.5 transition-colors">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        <p class="text-[11px] text-gray-400 truncate font-light">"${item.comment}"</p>
                    `;
                    list.appendChild(li);
                });
            }, (error) => console.error(error));
        }

        // Global Delete Handler
        window.deleteDocHandler = async (collectionName, id) => {
            if (!auth.currentUser) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id));
            } catch (err) {
                showModal("Error", `Could not purge item from ${collectionName}.`);
            }
        };

        // Forms Logic
        document.getElementById('addPortfolioForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!auth.currentUser) return;

            const urlInput = document.getElementById('ytLink');
            const url = urlInput.value.trim();
            const btn = e.target.querySelector('button');

            if (!url.includes('youtu')) return showModal("Invalid Format", "Requires a valid YouTube link.");

            btn.disabled = true; btn.textContent = "Processing...";
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'portfolio'), { url: url, timestamp: Date.now() });
                urlInput.value = '';
            } catch (err) {
                showModal("Error", "Addition failed.");
            } finally {
                btn.disabled = false; btn.textContent = "Add to Gallery";
            }
        });

        document.getElementById('addFeedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!auth.currentUser) return;

            const name = document.getElementById('fbName').value.trim();
            const role = document.getElementById('fbRole').value.trim();
            const rating = document.getElementById('fbRating').value;
            const comment = document.getElementById('fbComment').value.trim();
            const btn = e.target.querySelector('button');

            btn.disabled = true; btn.textContent = "Publishing...";
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'feedbacks'), { 
                    name, role, rating, comment, timestamp: Date.now() 
                });
                e.target.reset();
            } catch (err) {
                showModal("Error", "Publishing failed.");
            } finally {
                btn.disabled = false; btn.textContent = "Publish Legacy";
            }
        });

        // Initialize Firebase Auth
        async function initAdmin() {
            if (!auth) return;
            try {
                // Using standard anonymous auth for external custom Firebase project
                await signInAnonymously(auth);
                
                loadInquiries();
                loadPortfolio();
                loadFeedbacks();
            } catch (error) {
                console.error("Auth failed:", error);
                showModal("Connection Error", "System offline. Data sync failed.");
            }
        }
        
        // Listen for Enter key on login
        document.getElementById('adminPwd').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkLogin();
        });

    </script>
</body>
</html>
